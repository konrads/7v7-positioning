<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="7 v 7 Positioning">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>7 v 7 Positioning</title>
<style>
  :root {
    --panel-bg: #1e2530;
    --panel-text: #e8ecf1;
  }
  html, body {
    height: 100%;
    background: #12161c;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #12161c;
    color: var(--panel-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    min-height: 100vh;
  }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 16px; }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 0 auto 8px;
    max-width: 100%;
  }
  .panel-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .panel-cell.toolbar { gap: 14px; }
  #formationsRow, #manualRow { flex-wrap: nowrap; min-height: 30px; }
  .team-group { display: flex; align-items: center; gap: 6px; }
  .team-group + .team-group { margin-left: 10px; }
  .mode-group { display: inline-flex; align-items: center; gap: 10px; }
  .radio-label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--panel-text); cursor: pointer; }
  .radio-label input { cursor: pointer; }
  .size-slider-label { gap: 6px; }
  #sizeSlider { width: 70px; }
  select, button {
    background: var(--panel-bg);
    color: var(--panel-text);
    border: 1px solid #364152;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  input[type=text] {
    background: var(--panel-bg);
    color: var(--panel-text);
    border: 1px solid #364152;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    width: 160px;
  }
  select#savedSelect { max-width: 180px; }
  button:hover, select:hover { border-color: #5a6b82; }
  .label { font-size: 15px; color: #9aa5b1; }
  button:disabled, input:disabled { opacity: 0.35; cursor: not-allowed; }
  button:disabled:hover { border-color: #364152; }
  #clearPositionsBtn { min-width: 150px; white-space: nowrap; }
  #clearPositionsBtn.confirm-armed { background: #7a1420; border-color: #b33; color: #fff; }
  .field-wrap {
    position: relative;
    width: 100%;
    max-width: min(94vw, 900px);
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    min-height: 0;
    touch-action: none;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
    display: block;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    user-select: none;
    cursor: crosshair;
  }
  .player-group { cursor: grab; }
  .player-group.dragging { cursor: grabbing; }
  .player-group:hover .player-circle { filter: brightness(1.15); }
  .ball-group { cursor: grab; }
  .ball-group.dragging { cursor: grabbing; }
  .ball-group:hover .ball-shell { filter: brightness(1.1); }
  .player-label {
    font-size: 13px;
    font-weight: 700;
    fill: white;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>7 v 7 positioning</h1>

<div class="panel">
  <div class="panel-cell toolbar">
    <span class="mode-group">
      <label class="radio-label">
        <input type="radio" name="modeChoice" id="modeFormationsRadio" checked> Formations
      </label>
      <label class="radio-label">
        <input type="radio" name="modeChoice" id="modeManualRadio"> Manual
      </label>
    </span>
    <button id="deleteArrowsBtn">Reset</button>
    <button id="clearPositionsBtn">Delete All Manual</button>
    <label class="radio-label size-slider-label">
      Size
      <input type="range" id="sizeSlider" min="0.7" max="1.3" step="0.01" value="1">
    </label>
  </div>

  <div class="panel-cell" id="formationsRow">
    <span class="team-group">
      <span class="label" id="homeLabel">Home</span>
      <select id="homeFormation"></select>
    </span>
    <span class="team-group">
      <span class="label" id="awayLabel">Away</span>
      <select id="awayFormation"></select>
    </span>
  </div>
  <div class="panel-cell" id="manualRow" style="display:none">
    <select id="savedSelect"><option value="">No saved positions</option></select>
    <input type="text" id="saveNameInput" placeholder="Position name">
    <button id="saveBtn">Save</button>
    <button id="deleteBtn">Delete</button>
  </div>
</div>

<div class="field-wrap">
  <svg id="pitch" viewBox="0 -16 460 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="7 v 7 soccer field with movable players"></svg>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var W = 460, H = 600;
  var svg = document.getElementById('pitch');
  var margin = 12;
  var fieldTop = margin, fieldBottom = H - margin;
  var fieldLeft = margin, fieldRight = W - margin;
  var fieldW = fieldRight - fieldLeft;
  var fieldH = fieldBottom - fieldTop;

  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawField() {
    svg.appendChild(el('rect', {x: 0, y: 0, width: W, height: H, fill: '#3a8f3a'}));
    var stripes = 10;
    for (var i = 0; i < stripes; i++) {
      if (i % 2 === 0) {
        svg.appendChild(el('rect', {
          x: 0, y: i * (H / stripes), width: W, height: H / stripes, fill: '#368836'
        }));
      }
    }
    var lineColor = '#f2f2f2';
    svg.appendChild(el('rect', {x: margin, y: margin, width: W - 2 * margin, height: H - 2 * margin, stroke: lineColor, 'stroke-width': 2, fill: 'none'}));
    svg.appendChild(el('line', {x1: margin, y1: H / 2, x2: W - margin, y2: H / 2, stroke: lineColor, 'stroke-width': 2}));

    function endMarkings(dir) {
      var boxW = 220, boxD = 90;
      var boxY = dir === 'top' ? margin : H - margin - boxD;
      svg.appendChild(el('rect', {x: (W - boxW) / 2, y: boxY, width: boxW, height: boxD, stroke: lineColor, 'stroke-width': 2, fill: 'none'}));

      var spotY = dir === 'top' ? margin + 55 : H - margin - 55;
      svg.appendChild(el('circle', {cx: W / 2, cy: spotY, r: 2, fill: lineColor}));

      var goalW = 103, goalD = 16, goalShift = 3;
      var goalY = dir === 'top' ? margin - goalD - goalShift : H - margin + goalShift;
      var gx1 = (W - goalW) / 2, gx2 = gx1 + goalW;
      var goalPath = dir === 'top'
        ? 'M ' + gx1 + ' ' + (goalY + goalD) + ' L ' + gx1 + ' ' + goalY + ' L ' + gx2 + ' ' + goalY + ' L ' + gx2 + ' ' + (goalY + goalD)
        : 'M ' + gx1 + ' ' + goalY + ' L ' + gx1 + ' ' + (goalY + goalD) + ' L ' + gx2 + ' ' + (goalY + goalD) + ' L ' + gx2 + ' ' + goalY;
      svg.appendChild(el('path', {d: goalPath, fill: 'none', stroke: '#ffffff', 'stroke-width': 4, 'stroke-linecap': 'square'}));
    }
    endMarkings('top');
    endMarkings('bottom');
  }

  var formations = {
    "2-3-1 (attacking)": [
      {role: 'GK', x: 0.5, y: 0.06},
      {role: 'DF', x: 0.25, y: 0.24}, {role: 'DF', x: 0.75, y: 0.24},
      {role: 'MF', x: 0.16, y: 0.5}, {role: 'MF', x: 0.5, y: 0.44}, {role: 'MF', x: 0.84, y: 0.5},
      {role: 'FW', x: 0.5, y: 0.78}
    ],
    "3-2-1 (control)": [
      {role: 'GK', x: 0.5, y: 0.06},
      {role: 'DF', x: 0.2, y: 0.24}, {role: 'DF', x: 0.5, y: 0.2}, {role: 'DF', x: 0.8, y: 0.24},
      {role: 'MF', x: 0.3, y: 0.52}, {role: 'MF', x: 0.7, y: 0.52},
      {role: 'FW', x: 0.5, y: 0.8}
    ],
    "2-2-2 (balanced)": [
      {role: 'GK', x: 0.5, y: 0.06},
      {role: 'DF', x: 0.25, y: 0.22}, {role: 'DF', x: 0.75, y: 0.22},
      {role: 'MF', x: 0.25, y: 0.5}, {role: 'MF', x: 0.75, y: 0.5},
      {role: 'FW', x: 0.3, y: 0.78}, {role: 'FW', x: 0.7, y: 0.78}
    ],
    "4-1-1 (defensive)": [
      {role: 'GK', x: 0.5, y: 0.06},
      {role: 'DF', x: 0.12, y: 0.26}, {role: 'DF', x: 0.38, y: 0.22}, {role: 'DF', x: 0.62, y: 0.22}, {role: 'DF', x: 0.88, y: 0.26},
      {role: 'MF', x: 0.5, y: 0.5},
      {role: 'FW', x: 0.5, y: 0.8}
    ]
  };
  var formationNames = Object.keys(formations);
  var TEAM_FILL = {home: '#e63946', away: '#1d6fd8'};
  var teamOutlineColor = {home: '#7a1420', away: '#0d3f78'};
  var roleLetters = {GK: 'G', DF: 'D', MF: 'M', FW: 'S'};
  var SIZE_MULTIPLIER = 1; // scales both player and ball sizes uniformly (see #sizeSlider)
  var PLAYER_RX, PLAYER_RY, BALL_R;

  function recomputeSizes() {
    PLAYER_RX = 15.75 * SIZE_MULTIPLIER;
    PLAYER_RY = 18 * SIZE_MULTIPLIER;
    BALL_R = 12.6 * SIZE_MULTIPLIER;
  }
  recomputeSizes(); // establish initial values now; re-rendering happens separately, on demand
  var OUTLINE_WIDTH = 2.5; // team-outline stroke width, shared by the fallback ellipse and the photo ring

  function buildTeamPositions(formationKey, isHome) {
    var shape = formations[formationKey];
    return shape.map(function (p, i) {
      var px = p.x;
      if (!isHome && p.role === 'FW') {
        px = 0.5 + (p.x - 0.5) * 0.8167; // nudge away-team forwards toward center (one-third strength)
      }
      var x = fieldLeft + px * fieldW;
      var y;
      if (isHome) {
        y = fieldBottom - p.y * fieldH * 0.9 - fieldH * 0.02;
      } else {
        y = fieldTop + p.y * fieldH * 0.9 + fieldH * 0.02;
      }
      return {role: p.role, x: x, y: y, id: (isHome ? 'home' : 'away') + '-' + i, team: isHome ? 'home' : 'away'};
    });
  }

  var players = [];
  var ball = {id: 'ball', x: W / 2, y: H / 2};
  var arrowLayer = el('g', {id: 'arrowLayer'});
  var arrows = [];        // finalized <line> elements
  var draftArrow = null;
  var drawingArrow = false;
  var draftStart = {x: 0, y: 0};

  var defsEl = svg.appendChild(el('defs', {}));
  defsEl.appendChild((function () {
    var marker = el('marker', {
      id: 'arrowhead', viewBox: '0 0 10 10', refX: '8', refY: '5',
      markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'
    });
    marker.appendChild(el('path', {d: 'M 0 0 L 10 5 L 0 10 z', fill: '#ffe066'}));
    return marker;
  })());

  function clearArrows() {
    arrows.forEach(function (a) { a.remove(); });
    arrows = [];
    if (draftArrow) { draftArrow.remove(); draftArrow = null; }
    drawingArrow = false;
  }

  function pentagonPoints(r, rotationDeg) {
    var pts = [];
    for (var i = 0; i < 5; i++) {
      var angle = (rotationDeg + i * 72) * Math.PI / 180;
      pts.push((r * Math.cos(angle)).toFixed(2) + ',' + (r * Math.sin(angle)).toFixed(2));
    }
    return pts.join(' ');
  }

  function renderBall() {
    var BALL_PENTAGON_R = 7.65 * SIZE_MULTIPLIER;
    var old = svg.querySelector('.ball-group');
    if (old) old.remove();
    var g = el('g', {class: 'ball-group player-group', 'data-id': ball.id, transform: 'translate(' + ball.x + ',' + ball.y + ')'});
    g.appendChild(el('circle', {class: 'ball-shell', r: BALL_R, fill: '#ffffff', stroke: '#1a1a1a', 'stroke-width': 1.6}));
    g.appendChild(el('polygon', {points: pentagonPoints(BALL_PENTAGON_R, -90), fill: '#1a1a1a'}));
    for (var i = 0; i < 5; i++) {
      var a1 = (-90 + i * 72) * Math.PI / 180;
      var x1 = BALL_PENTAGON_R * Math.cos(a1), y1 = BALL_PENTAGON_R * Math.sin(a1);
      var x2 = BALL_R * Math.cos(a1), y2 = BALL_R * Math.sin(a1);
      g.appendChild(el('line', {x1: x1, y1: y1, x2: x2, y2: y2, stroke: '#1a1a1a', 'stroke-width': 1}));
    }
    svg.appendChild(g);
    attachDrag(g, ball);
  }

  function initPlayers() {
    var homeKey = document.getElementById('homeFormation').value;
    var awayKey = document.getElementById('awayFormation').value;
    players = buildTeamPositions(homeKey, true).concat(buildTeamPositions(awayKey, false));
    ball.x = W / 2;
    ball.y = H / 2;
    clearArrows();
    renderBall();
    renderPlayers();
    setBaseline();
  }

  // ---------- Mode (Formations vs Manual) + Reset baseline tracking ----------
  // These four are the only pieces of "derived UI" state. Every event handler's job is
  // simply: mutate mode / savedPositionId / baselineState / players / ball / arrows,
  // then call render() once. render() is the ONLY place that writes to the control
  // panel's DOM (disabled states, row visibility, dropdown options, radio checks) — no
  // handler should set any of that directly, to avoid the panel drifting out of sync.
  var mode = 'formations';
  var savedPositionId = ''; // currently selected saved position id (Manual mode only)
  var baselineState = null; // null = no defined baseline to revert to (e.g. blank Manual slate)

  function serializeFieldState() {
    return JSON.stringify({
      sizeMultiplier: SIZE_MULTIPLIER,
      players: players.map(function (p) { return {id: p.id, role: p.role, team: p.team, x: p.x, y: p.y}; }),
      ball: {x: ball.x, y: ball.y},
      arrows: arrows.map(function (a) {
        return {
          x1: parseFloat(a.getAttribute('x1')), y1: parseFloat(a.getAttribute('y1')),
          x2: parseFloat(a.getAttribute('x2')), y2: parseFloat(a.getAttribute('y2'))
        };
      })
    });
  }

  function setBaseline() {
    baselineState = serializeFieldState();
  }

  // Reverts the field to the in-memory baseline — used when Reset is pressed in Manual
  // mode with no actual saved position backing it (an ad-hoc / not-yet-saved baseline).
  function restoreBaseline() {
    if (baselineState === null) return;
    var state = JSON.parse(baselineState);
    SIZE_MULTIPLIER = (typeof state.sizeMultiplier === 'number') ? state.sizeMultiplier : 1;
    recomputeSizes();
    document.getElementById('sizeSlider').value = SIZE_MULTIPLIER;
    players = state.players.map(function (p) { return {id: p.id, role: p.role, team: p.team, x: p.x, y: p.y}; });
    ball.x = state.ball.x;
    ball.y = state.ball.y;
    renderBall();
    renderPlayers();
    clearArrows();
    state.arrows.forEach(function (a) {
      var line = el('line', {
        x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2,
        stroke: '#ffe066', 'stroke-width': 3, 'marker-end': 'url(#arrowhead)'
      });
      arrowLayer.appendChild(line);
      arrows.push(line);
    });
  }

  function setMode(newMode) {
    mode = newMode;
    if (mode === 'formations') {
      initPlayers(); // reapply the selected formations
    } else {
      if (!savedPositionId) {
        // Nothing chosen yet this session — default to the first saved position, if any exist.
        var list = loadSnapshots();
        if (list.length > 0) savedPositionId = list[0].id;
      }
      var snap = savedPositionId ? loadSnapshots().filter(function (s) { return s.id === savedPositionId; })[0] : null;
      if (snap) {
        applySnapshot(snap);
      } else {
        // No saved position to load, but whatever's on the field right now is still a
        // meaningful baseline — Reset should undo changes made since entering Manual mode.
        setBaseline();
      }
    }
  }

  // The single source of truth for all control-panel DOM: row visibility, radio state,
  // the saved-positions dropdown, and every button/input's disabled state. Called after
  // every state-mutating action; never called mid-mutation.
  function render() {
    document.getElementById('formationsRow').style.display = mode === 'formations' ? '' : 'none';
    document.getElementById('manualRow').style.display = mode === 'manual' ? '' : 'none';
    document.getElementById('modeFormationsRadio').checked = (mode === 'formations');
    document.getElementById('modeManualRadio').checked = (mode === 'manual');

    var list = loadSnapshots();
    var sel = document.getElementById('savedSelect');
    sel.innerHTML = '';
    var pickOpt = document.createElement('option');
    pickOpt.value = '';
    pickOpt.textContent = 'No saved positions';
    sel.appendChild(pickOpt);
    var stillExists = false;
    list.forEach(function (snap) {
      var opt = document.createElement('option');
      opt.value = snap.id;
      opt.textContent = snap.name;
      sel.appendChild(opt);
      if (snap.id === savedPositionId) stillExists = true;
    });
    if (!stillExists) savedPositionId = '';
    sel.value = savedPositionId;

    var unchanged = baselineState !== null && serializeFieldState() === baselineState;
    document.getElementById('deleteArrowsBtn').disabled = (baselineState === null) || unchanged;
    // The name field itself is disabled only when there's a baseline and nothing has
    // changed since it — a blank Manual slate (no baseline yet) still allows typing a
    // name for a brand-new position. Save additionally requires a non-empty name.
    var nameInput = document.getElementById('saveNameInput');
    nameInput.disabled = unchanged;
    var nameEmpty = nameInput.value.trim() === '';
    document.getElementById('saveBtn').disabled = unchanged || nameEmpty;
    // Delete (a single saved position) only makes sense once one is actually selected.
    document.getElementById('deleteBtn').disabled = !savedPositionId;
    document.getElementById('clearPositionsBtn').disabled = (list.length === 0);
  }

  var roleImageNames = {GK: 'goalie', DF: 'defender', MF: 'midfielder', FW: 'striker'};
  // Expected filenames: home-striker1.png, away-defender1.png, etc.
  var photoFilenameCounters = {}; // per-role-per-team counter, reset each render so numbering restarts cleanly

  function tryLoadPlayerPhoto(g, p, teamColor, circle, label) {
    var base = roleImageNames[p.role];
    if (!base) return;
    var key = p.team + '-' + base;
    photoFilenameCounters[key] = (photoFilenameCounters[key] || 0) + 1;
    var filename = key + photoFilenameCounters[key] + '.png';

    var probe = new Image();
    probe.onload = function () {
      if (!g.parentNode) return;
      var backdrop = el('ellipse', {rx: PLAYER_RX, ry: PLAYER_RY, fill: teamColor});
      var img = el('image', {
        x: -PLAYER_RX, y: -PLAYER_RY, width: PLAYER_RX * 2, height: PLAYER_RY * 2,
        preserveAspectRatio: 'xMidYMid meet'
      });
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', filename);
      img.setAttribute('href', filename);
      var ring = el('ellipse', {rx: PLAYER_RX, ry: PLAYER_RY, fill: 'none', stroke: teamOutlineColor[p.team], 'stroke-width': OUTLINE_WIDTH});

      circle.remove();
      label.remove();
      g.appendChild(backdrop);
      g.appendChild(img);
      g.appendChild(ring);
    };
    probe.onerror = function () { /* keep the circle + letter fallback */ };
    probe.src = filename;
  }

  function renderPlayers() {
    var old = svg.querySelectorAll('.player-group:not(.ball-group)');
    old.forEach(function (n) { n.remove(); });
    photoFilenameCounters = {};
    players.forEach(function (p) {
      var g = el('g', {class: 'player-group', 'data-id': p.id, transform: 'translate(' + p.x + ',' + p.y + ')'});
      var teamColor = TEAM_FILL[p.team];
      var circle = el('ellipse', {class: 'player-circle', rx: PLAYER_RX, ry: PLAYER_RY, fill: teamColor, stroke: teamOutlineColor[p.team], 'stroke-width': OUTLINE_WIDTH});
      var label = el('text', {class: 'player-label', x: 0, y: 0.5});
      label.textContent = roleLetters[p.role];
      g.appendChild(circle);
      g.appendChild(label);
      svg.appendChild(g);
      attachDrag(g, p);
      tryLoadPlayerPhoto(g, p, teamColor, circle, label);
    });
  }

  function applySizeMultiplier(value) {
    SIZE_MULTIPLIER = value;
    recomputeSizes();
    renderBall();
    renderPlayers();
  }

  function svgPoint(evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return {x: 0, y: 0};
    return pt.matrixTransform(ctm.inverse());
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function attachDrag(g, p) {
    var dragging = false;
    var offset = {x: 0, y: 0};
    var isBall = (p === ball);
    // Ball stays fully on the field; players may hang most of their body over the line.
    var marginX = isBall ? 8 : PLAYER_RX / 6;
    var marginY = isBall ? 8 : PLAYER_RY / 6;

    function onDown(evt) {
      dragging = true;
      g.classList.add('dragging');
      svg.appendChild(g);
      var pt = svgPoint(evt);
      offset.x = pt.x - p.x;
      offset.y = pt.y - p.y;
      try { g.setPointerCapture(evt.pointerId); } catch (e) {}
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    function onMove(evt) {
      if (!dragging) return;
      var pt = svgPoint(evt);
      p.x = clamp(pt.x - offset.x, fieldLeft + marginX, fieldRight - marginX);
      p.y = clamp(pt.y - offset.y, fieldTop + marginY, fieldBottom - marginY);
      g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
    }

    function onUp() {
      dragging = false;
      g.classList.remove('dragging');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      render();
    }

    g.addEventListener('pointerdown', onDown);
  }

  function populateSelects() {
    var homeSel = document.getElementById('homeFormation');
    var awaySel = document.getElementById('awayFormation');
    formationNames.forEach(function (name) {
      var o1 = document.createElement('option'); o1.value = name; o1.textContent = name;
      var o2 = document.createElement('option'); o2.value = name; o2.textContent = name;
      homeSel.appendChild(o1);
      awaySel.appendChild(o2);
    });
    homeSel.value = formationNames[0];
    awaySel.value = formationNames[2 % formationNames.length];
  }

  // ---------- Saved positions (localStorage) ----------
  var STORAGE_KEY = 'soccerPositioningSnapshots';

  function loadSnapshots() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function persistSnapshots(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function captureSnapshot(name) {
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name,
      sizeMultiplier: SIZE_MULTIPLIER,
      players: players.map(function (p) {
        return {id: p.id, role: p.role, team: p.team, x: p.x, y: p.y};
      }),
      ball: {x: ball.x, y: ball.y},
      arrows: arrows.map(function (a) {
        return {
          x1: parseFloat(a.getAttribute('x1')), y1: parseFloat(a.getAttribute('y1')),
          x2: parseFloat(a.getAttribute('x2')), y2: parseFloat(a.getAttribute('y2'))
        };
      })
    };
  }

  function applySnapshot(snap) {
    // Restore size first, so players/ball/arrows only need to be drawn once, at the
    // right scale — older snapshots saved before this feature existed default to 1.
    SIZE_MULTIPLIER = (typeof snap.sizeMultiplier === 'number') ? snap.sizeMultiplier : 1;
    recomputeSizes();
    document.getElementById('sizeSlider').value = SIZE_MULTIPLIER;

    players = snap.players.map(function (p) { return {id: p.id, role: p.role, team: p.team, x: p.x, y: p.y}; });
    if (snap.ball) {
      ball.x = snap.ball.x;
      ball.y = snap.ball.y;
    } else {
      ball.x = W / 2;
      ball.y = H / 2;
    }
    renderBall();
    renderPlayers();
    clearArrows();
    snap.arrows.forEach(function (a) {
      var line = el('line', {
        x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2,
        stroke: '#ffe066', 'stroke-width': 3, 'marker-end': 'url(#arrowhead)'
      });
      arrowLayer.appendChild(line);
      arrows.push(line);
    });
    savedPositionId = snap.id;
    // Prefill the name field with this position's name, so Save overwrites it by default.
    document.getElementById('saveNameInput').value = snap.name;
    setBaseline();
  }

  // ---------- Initial render ----------
  drawField();
  svg.appendChild(arrowLayer);
  populateSelects();
  setMode('formations');
  render();

  // ---------- Event listeners ----------
  // Every handler below follows the same shape: mutate state, then call render() once.

  // Arrow drawing: drag on empty pitch space; double-click clears all arrows
  svg.addEventListener('pointerdown', function (evt) {
    var onPlayer = evt.target.closest ? evt.target.closest('.player-group') : null;
    if (onPlayer) return; // clicking a player still moves it, not an arrow
    drawingArrow = true;
    var pt = svgPoint(evt);
    draftStart.x = pt.x;
    draftStart.y = pt.y;
    draftArrow = el('line', {
      x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y,
      stroke: '#ffe066', 'stroke-width': 3, 'marker-end': 'url(#arrowhead)'
    });
    arrowLayer.appendChild(draftArrow);
    try { svg.setPointerCapture(evt.pointerId); } catch (e) {}
  });

  svg.addEventListener('pointermove', function (evt) {
    if (!drawingArrow || !draftArrow) return;
    var pt = svgPoint(evt);
    draftArrow.setAttribute('x2', pt.x);
    draftArrow.setAttribute('y2', pt.y);
  });

  svg.addEventListener('pointerup', function (evt) {
    if (!drawingArrow || !draftArrow) return;
    drawingArrow = false;
    var pt = svgPoint(evt);
    var dx = pt.x - draftStart.x, dy = pt.y - draftStart.y;
    if (Math.sqrt(dx * dx + dy * dy) < 8) {
      draftArrow.remove(); // treat as an accidental tap, not a real arrow
    } else {
      arrows.push(draftArrow);
      render();
    }
    draftArrow = null;
  });

  svg.addEventListener('dblclick', function (evt) {
    var onPlayer = evt.target.closest ? evt.target.closest('.player-group') : null;
    if (onPlayer) return; // double-clicking a player is not a clear-arrows gesture
    clearArrows();
    render();
  });

  // Formation controls
  document.getElementById('homeFormation').addEventListener('change', function () { initPlayers(); render(); });
  document.getElementById('awayFormation').addEventListener('change', function () { initPlayers(); render(); });
  document.getElementById('modeFormationsRadio').addEventListener('change', function () { if (this.checked) { setMode('formations'); render(); } });
  document.getElementById('modeManualRadio').addEventListener('change', function () { if (this.checked) { setMode('manual'); render(); } });
  document.getElementById('sizeSlider').addEventListener('input', function () { applySizeMultiplier(parseFloat(this.value)); render(); });
  document.getElementById('deleteArrowsBtn').addEventListener('click', function () {
    // Reset means "back to the current baseline" — the loaded saved position in Manual
    // mode (or its ad-hoc in-memory baseline if nothing's actually saved), or the
    // selected formations in Formations mode.
    if (mode === 'manual') {
      var snap = savedPositionId ? loadSnapshots().filter(function (s) { return s.id === savedPositionId; })[0] : null;
      if (snap) {
        applySnapshot(snap);
      } else {
        restoreBaseline();
      }
    } else {
      initPlayers();
    }
    render();
  });

  // Saved positions
  document.getElementById('saveBtn').addEventListener('click', function () {
    var input = document.getElementById('saveNameInput');
    var name = input.value.trim();
    if (!name) { input.focus(); return; }
    var list = loadSnapshots();
    var snap = captureSnapshot(name);
    var existingIndex = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].name.trim().toLowerCase() === name.toLowerCase()) { existingIndex = i; break; }
    }
    if (existingIndex !== -1) {
      snap.id = list[existingIndex].id; // keep the same id so the dropdown selection stays put
      list[existingIndex] = snap;
    } else {
      list.push(snap);
    }
    persistSnapshots(list);
    savedPositionId = snap.id;
    setBaseline(); // this save is now the baseline Reset will revert to
    render();
  });

  document.getElementById('saveNameInput').addEventListener('keydown', function (evt) {
    if (evt.key === 'Enter') document.getElementById('saveBtn').click();
  });

  document.getElementById('saveNameInput').addEventListener('input', render);

  document.getElementById('savedSelect').addEventListener('change', function () {
    savedPositionId = this.value;
    if (!savedPositionId) {
      // back to a blank Manual slate — the field stays as-is, and that becomes the new baseline
      setBaseline();
    } else {
      var snap = loadSnapshots().filter(function (s) { return s.id === savedPositionId; })[0];
      if (snap) applySnapshot(snap);
    }
    render();
  });

  document.getElementById('deleteBtn').addEventListener('click', function () {
    if (!savedPositionId) return;
    persistSnapshots(loadSnapshots().filter(function (s) { return s.id !== savedPositionId; }));
    savedPositionId = '';
    // The saved position is gone, but the field still shows it — that becomes the new
    // (unsaved) baseline, so Reset undoes only changes made after the deletion.
    setBaseline();
    render();
  });

  // Delete All Manual uses a two-tap confirm instead of window.confirm() — native dialogs
  // aren't reliable everywhere this page might run (iOS home-screen/standalone mode,
  // in-app webviews, sandboxed previews), so the confirmation is built in-page instead.
  var deleteAllArmed = false;
  var deleteAllArmTimer = null;

  function disarmDeleteAll() {
    deleteAllArmed = false;
    clearTimeout(deleteAllArmTimer);
    var btn = document.getElementById('clearPositionsBtn');
    btn.textContent = 'Delete All Manual';
    btn.classList.remove('confirm-armed');
  }

  document.getElementById('clearPositionsBtn').addEventListener('click', function () {
    if (loadSnapshots().length === 0) return;
    if (!deleteAllArmed) {
      deleteAllArmed = true;
      this.textContent = 'Tap again to confirm';
      this.classList.add('confirm-armed');
      deleteAllArmTimer = setTimeout(disarmDeleteAll, 3500);
      return;
    }
    disarmDeleteAll();
    persistSnapshots([]);
    savedPositionId = '';
    setMode('formations'); // nothing left to view in Manual, so switch back with formations loaded
    render();
  });

  // Any other interaction cancels a pending confirmation, so it doesn't linger armed.
  document.addEventListener('pointerdown', function (evt) {
    if (deleteAllArmed && evt.target.id !== 'clearPositionsBtn') disarmDeleteAll();
  });
})();
</script>

</body>
</html>
